<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUGA Fashion | Summer '26</title>
<link rel="icon" type="image/png" href="Y Falvion.png">
<link rel="stylesheet" href="style.css">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1)}
html{scroll-behavior:smooth}
body{background:#000}
.summer-page{min-height:100vh;background:#000;color:#fff;padding:0 5vw 90px;overflow:hidden}
.summer-hero{display:flex;align-items:center;justify-content:center;text-align:center;padding:42px 20px 34px}
.hero-inner{max-width:1100px}
.eyebrow{font-size:10px;letter-spacing:5px;font-weight:800;opacity:.7;margin:0 0 16px}
.summer-hero h1{margin:0;font-size:clamp(42px,6vw,76px);line-height:.95;letter-spacing:4px}
.hero-tag{font-size:12px;letter-spacing:3px;opacity:.65;margin:18px 0 0;text-transform:uppercase}
.summer-grid{width:100%;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.summer-card{position:relative;display:block;height:620px;overflow:hidden;color:#fff;text-decoration:none;background:#111;transform:translateY(30px);opacity:0;animation:cardIn .9s var(--ease) forwards;isolation:isolate}
.summer-card:nth-child(2){animation-delay:.12s}.summer-card:nth-child(3){animation-delay:.24s}
.summer-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .9s var(--ease),filter .7s ease}
.summer-card:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.02) 65%);z-index:1}
.summer-card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);transform:translateX(-130%);z-index:2;transition:transform .9s var(--ease)}
.summer-card:hover img{transform:scale(1.065)}.summer-card:hover:before{transform:translateX(130%)}
.summer-card-content{position:absolute;z-index:3;left:30px;right:30px;bottom:30px;transform:translateY(7px);transition:transform .6s var(--ease)}
.summer-card:hover .summer-card-content{transform:translateY(0)}
.summer-card-content h2{margin:0;font-size:clamp(34px,3.5vw,52px);letter-spacing:3px}
.summer-card-content p{margin:8px 0 0;font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.75}
.summer-card-content span{display:inline-block;margin-top:18px;font-size:9px;letter-spacing:2px;font-weight:800;transition:transform .5s var(--ease)}
.summer-card:hover span{transform:translateX(7px)}
.summer-back{display:block;width:fit-content;margin:50px auto 0;color:#fff;text-decoration:none;font-size:10px;letter-spacing:2px;font-weight:800;opacity:.7;transition:opacity .3s,transform .3s}
.summer-back:hover{opacity:1;transform:translateX(-4px)}
.droplet{position:fixed;pointer-events:none;width:8px;height:8px;border:1px solid rgba(255,255,255,.7);border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:drop .7s ease-out forwards;z-index:9999}
@keyframes cardIn{to{opacity:1;transform:translateY(0)}}
@keyframes drop{to{transform:translate(-50%,-50%) scale(8);opacity:0}}
@media(max-width:800px){
 .summer-page{padding:0 14px 70px}
 .summer-hero{padding:34px 10px 28px}
 .eyebrow{font-size:9px;letter-spacing:4px;margin-bottom:13px}
 .summer-hero h1{font-size:clamp(40px,12vw,62px);letter-spacing:3px}
 .hero-tag{font-size:10px;letter-spacing:2px;margin-top:14px}
 .summer-grid{grid-template-columns:1fr;gap:14px}
 .summer-card{height:72vh;min-height:500px;max-height:700px}
 .summer-card-content{left:22px;right:22px;bottom:22px}
 .summer-card-content h2{font-size:42px}
 .summer-card:active img{transform:scale(1.04)}
 .summer-card:active .summer-card-content{transform:translateY(-3px)}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header><a href="index.html"><img src="Logo.png" alt="YUGA Fashion"></a></header>
<main class="summer-page">
<section class="summer-hero">
<div class="hero-inner">
<p class="eyebrow">YUGA FASHION · SUMMER '26</p>
<h1>SUMMER '26</h1>
<p class="hero-tag">Choose your era. Find your fit.</p>
</div>
</section>
<section class="summer-grid">
<a class="summer-card" href="plain.html"><img src="plain1.c.png" alt="YUGA Plain Collection"><div class="summer-card-content"><h2>PLAIN</h2><p>Essential Everyday Wear</p><span>SHOP PLAIN →</span></div></a>
<a class="summer-card" href="polo.html"><img src="polo1c.png" alt="YUGA Polo Collection"><div class="summer-card-content"><h2>POLO</h2><p>Classic. Clean. Timeless.</p><span>SHOP POLO →</span></div></a>
<a class="summer-card" href="printed.html"><img src="printed1c.png" alt="YUGA Printed Collection"><div class="summer-card-content"><h2>PRINTED</h2><p>Express Yourself</p><span>SHOP PRINTED →</span></div></a>
</section>
<a class="summer-back" href="index.html#collections">← BACK TO YUGA</a>
</main>
<script>
(function(){
 const cards=document.querySelectorAll('.summer-card');
 function ripple(x,y){
   const d=document.createElement('span'); d.className='droplet'; d.style.left=x+'px'; d.style.top=y+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),750);
 }
 cards.forEach(card=>{
   card.addEventListener('pointerdown',e=>ripple(e.clientX,e.clientY),{passive:true});
 });
 let last=0;
 document.addEventListener('pointermove',e=>{
   if(e.pointerType==='touch'){
     const now=Date.now(); if(now-last>120){ripple(e.clientX,e.clientY);last=now;}
   }
 },{passive:true});
 document.querySelectorAll('a[href]').forEach(a=>{
   const href=a.getAttribute('href');
   if(!href||href.startsWith('#')||href.startsWith('http')||href.startsWith('mailto:')||href.startsWith('tel:')||a.target==='_blank')return;
   a.addEventListener('click',e=>{
     e.preventDefault(); document.body.style.opacity='0'; document.body.style.transform='translateY(-8px)'; document.body.style.transition='opacity .35s ease,transform .35s ease';
     setTimeout(()=>location.href=href,350);
   });
 });
})();
</script>
</body>
</html>
